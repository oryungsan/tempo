[package]
name = "tempo"
version = "1.0.2"
edition = "2021"
description = "Tempo — 타이머 · 알람 · 리마인더 · 스톱워치 (Windows)"
license = "MIT"

[[bin]]
name = "tempo"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
rodio = { version = "0.20", default-features = false, features = ["wav", "symphonia-mp3", "symphonia-flac", "vorbis"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tray-icon = "0.19"
rfd = "0.15"
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
